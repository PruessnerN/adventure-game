services:
  story-sprout-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: story-sprout-api
    init: true
    expose:
      - "3003"
    stop_grace_period: 12s
    environment:
      PORT: 3003
      DATABASE_PATH: /app/data/story-sprout.sqlite
      AI_BASE_URL: ${AI_BASE_URL:-http://192.168.0.48:33821/v1}
      AI_MODEL: ${AI_MODEL:-local-model}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-900000}
    volumes:
      - story-sprout-data:/app/data
    restart: unless-stopped

  story-sprout-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: story-sprout-ui
    ports:
      - "${UI_PORT:-3002}:80"
    depends_on:
      - story-sprout-api
    restart: unless-stopped

volumes:
  story-sprout-data:
